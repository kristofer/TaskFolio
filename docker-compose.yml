services:
  tasking:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tasking
    ports:
      - "9205:9205"
    volumes:
      # Persistent database storage
      - tasking-data:/data
    environment:
      - PORT=9205
    restart: unless-stopped

volumes:
  # Named volume for persistent database storage
  tasking-data:
    driver: local

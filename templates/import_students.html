<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Import Students - TaskFolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/css/classic.css">
    <style>
        body { background: #F0F4F8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .page-container { max-width: 680px; margin: 40px auto; padding: 0 20px; }
        .card { background: white; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 30px; }
        .card h2 { font-size: 22px; font-weight: 700; color: #1f2937; margin-bottom: 6px; }
        .card .subtitle { color: #6b7280; margin-bottom: 24px; font-size: 14px; }
        .example-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 14px 16px; font-size: 13px; color: #475569; margin-bottom: 20px; font-family: monospace; line-height: 1.7; }
        label { font-weight: 600; font-size: 14px; color: #374151; display: block; margin-bottom: 6px; }
        input[type="file"] { width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; background: white; }
        .form-group { margin-bottom: 20px; }
        .btn-primary-custom { padding: 10px 22px; background: #1571BD; color: white; border: none; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer; }
        .btn-primary-custom:hover { background: #105DA0; }
        .btn-cancel { padding: 10px 22px; background: #f3f4f6; color: #374151; border: none; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-cancel:hover { background: #e5e7eb; }
    </style>
</head>
<body>
    {{template "navbar" .}}

    <div class="page-container">
        <div class="card">
            <h2>Import Students from CSV</h2>
            <p class="subtitle">Upload a CSV file to bulk-create student accounts.</p>

            <div class="example-box">
                <strong>CSV format:</strong> Username, Password, Cohort (cohort is optional)<br><br>
                AndrewYounger, zipcode0, Java1.0<br>
                BillyBobThornton, zipcode1, Data1.0<br>
                JaneSmith, zipcode2
            </div>

            <form action="/students/import" method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="csvfile">Select CSV File:</label>
                    <input type="file" name="csvfile" id="csvfile" accept=".csv" required>
                </div>
                <div style="display: flex; gap: 12px; margin-top: 8px;">
                    <button type="submit" class="btn-primary-custom">Upload &amp; Import</button>
                    <a href="/students" class="btn-cancel">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
